# Note: databricks.yml's apps.lakebase_app.config.command overrides this for
# bundle deploys. This file matters for `databricks apps run-local` and as a
# standalone fallback if the app is ever deployed outside the bundle.
command:
  - gunicorn
  - -b
  - 0.0.0.0:8000
  - --workers=2
  - --threads=2
  - --timeout=30
  - app:app
