<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860" role="img" aria-labelledby="title desc">
  <title id="title">Orders Dashboard Architecture</title>
  <desc id="desc">SVG architecture diagram equivalent to the Mermaid graph in README.</desc>

  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px Segoe UI, Arial, sans-serif; fill: #475569; }

      .appNode { fill: #eef4ff; stroke: #3b82f6; }
      .infraNode { fill: #fff5eb; stroke: #ea580c; }
      .dataNode { fill: #ecfdf3; stroke: #16a34a; }
      .node { stroke-width: 2; }

      .label { font: 700 18px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 600 14px Segoe UI, Arial, sans-serif; fill: #334155; }

      .edge { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1560" height="860" />
  <rect class="frame" x="24" y="24" width="1512" height="812" rx="12" />

  <text class="title" x="56" y="74">Orders Dashboard - Lakebase + Databricks</text>
  <text class="subtitle" x="56" y="102">Static SVG version aligned to the Mermaid architecture graph in this README.</text>

  <rect class="node appNode" x="76" y="180" width="170" height="78" rx="12" />
  <text class="label" x="100" y="227">User Browser</text>

  <rect class="node appNode" x="296" y="158" width="238" height="108" rx="12" />
  <text class="label" x="330" y="210">Databricks App</text>
  <text class="sub" x="324" y="235">Flask Orders Dashboard</text>

  <polygon class="node appNode" points="292,336 520,336 546,394 266,394" />
  <text class="label" x="311" y="370">Routes and JSON API</text>
  <text class="sub" x="308" y="388">/, /api/orders, /api/notes</text>

  <rect class="node infraNode" x="618" y="158" width="252" height="108" rx="12" />
  <text class="label" x="654" y="208">WorkspaceClient</text>
  <text class="sub" x="648" y="233">Generate DB Credential</text>

  <rect class="node infraNode" x="930" y="158" width="334" height="108" rx="12" />
  <text class="label" x="970" y="208">Lakebase Endpoint</text>
  <text class="sub" x="955" y="233">HA Read/Write + Readable Secondaries</text>

  <g>
    <ellipse class="node dataNode" cx="744" cy="352" rx="132" ry="24" />
    <rect class="node dataNode" x="612" y="352" width="264" height="82" />
    <ellipse class="node dataNode" cx="744" cy="434" rx="132" ry="24" />
    <text class="label" x="665" y="390">Lakebase Postgres</text>
    <text class="sub" x="700" y="413">notes table</text>
  </g>

  <g>
    <ellipse class="node dataNode" cx="1098" cy="352" rx="166" ry="24" />
    <rect class="node dataNode" x="932" y="352" width="332" height="82" />
    <ellipse class="node dataNode" cx="1098" cy="434" rx="166" ry="24" />
    <text class="label" x="1007" y="390">Lakebase Postgres</text>
    <text class="sub" x="1022" y="413">orders_synced table</text>
  </g>

  <rect class="node infraNode" x="954" y="524" width="288" height="104" rx="12" />
  <text class="label" x="984" y="574">postgres_synced_tables</text>
  <text class="sub" x="1048" y="599">continuous sync</text>

  <g>
    <ellipse class="node dataNode" cx="744" cy="548" rx="132" ry="24" />
    <rect class="node dataNode" x="612" y="548" width="264" height="78" />
    <ellipse class="node dataNode" cx="744" cy="626" rx="132" ry="24" />
    <text class="label" x="637" y="584">Unity Catalog Delta Table</text>
    <text class="sub" x="662" y="606">main.sales.orders with CDF</text>
  </g>

  <rect class="node infraNode" x="806" y="694" width="284" height="104" rx="12" />
  <text class="label" x="840" y="744">postgres_catalogs</text>
  <text class="sub" x="878" y="768">UC Binding</text>

  <rect class="node appNode" x="1240" y="706" width="250" height="86" rx="12" />
  <text class="label" x="1270" y="742">SQL Warehouses and</text>
  <text class="label" x="1322" y="765">Notebooks</text>

  <path class="edge" d="M246 219 L296 212" />
  <path class="edge" d="M416 266 L406 336" />
  <path class="edge" d="M534 212 L618 212" />
  <path class="edge" d="M870 212 L930 212" />
  <path class="edge" d="M546 368 L612 392" />
  <path class="edge" d="M546 384 L932 392" />
  <path class="edge" d="M1096 266 L744 328" />
  <path class="edge" d="M1098 266 L1098 328" />
  <path class="edge" d="M876 586 L954 576" />
  <path class="edge" d="M1098 524 L1098 458" />
  <path class="edge" d="M1098 266 L948 694" />
  <path class="edge" d="M1090 746 L1240 748" />
</svg>
