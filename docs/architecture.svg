<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Orders Dashboard Architecture</title>
  <desc id="desc">Parity SVG for the Mermaid architecture: user browser, Databricks app, routes and API, Lakebase endpoint, synced tables, Unity Catalog binding, and SQL warehouses and notebooks.</desc>

  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 16px Segoe UI, Arial, sans-serif; fill: #475569; }

      .lane-app { fill: #eef4ff; stroke: #c6d7ff; }
      .lane-lakebase { fill: #f2fff7; stroke: #bde8cc; }
      .lane-analytics { fill: #fff8f1; stroke: #ffd7b8; }
      .lane-title { font: 700 14px Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: 0.4px; }

      .node-stroke { stroke-width: 2; }
      .svc { fill: #ffffff; stroke: #3b82f6; }
      .infra { fill: #ffffff; stroke: #f97316; }
      .data { fill: #ffffff; stroke: #16a34a; }

      .label { font: 700 18px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .line { font: 600 14px Segoe UI, Arial, sans-serif; fill: #334155; }

      .edge { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="920" />

  <text class="title" x="46" y="58">Orders Dashboard Architecture (SVG)</text>
  <text class="sub" x="46" y="86">This SVG mirrors the README Mermaid graph node names and edge flow one-to-one.</text>

  <rect class="lane-app" x="40" y="122" width="500" height="730" rx="12" />
  <rect class="lane-lakebase" x="560" y="122" width="700" height="730" rx="12" />
  <rect class="lane-analytics" x="1280" y="122" width="280" height="730" rx="12" />

  <text class="lane-title" x="58" y="148">APPLICATION</text>
  <text class="lane-title" x="578" y="148">LAKEBASE + SYNC</text>
  <text class="lane-title" x="1298" y="148">ANALYTICS</text>

  <rect class="svc node-stroke" x="76" y="210" width="180" height="86" rx="14" />
  <text class="label" x="105" y="260">User Browser</text>

  <rect class="svc node-stroke" x="306" y="188" width="220" height="118" rx="14" />
  <text class="label" x="343" y="240">Databricks App</text>
  <text class="line" x="341" y="266">Flask Orders Dashboard</text>

  <polygon class="svc node-stroke" points="308,372 510,372 528,426 290,426" />
  <text class="label" x="338" y="405">Routes and JSON API</text>
  <text class="line" x="323" y="421">/, /api/orders, /api/notes</text>

  <rect class="infra node-stroke" x="646" y="194" width="246" height="112" rx="14" />
  <text class="label" x="685" y="244">WorkspaceClient</text>
  <text class="line" x="671" y="269">Generate DB Credential</text>

  <rect class="infra node-stroke" x="940" y="194" width="298" height="112" rx="14" />
  <text class="label" x="984" y="244">Lakebase Endpoint</text>
  <text class="line" x="958" y="269">HA Read/Write + Readable Secondaries</text>

  <rect class="data node-stroke" x="644" y="384" width="246" height="112" rx="56" />
  <text class="label" x="688" y="437">Lakebase Postgres</text>
  <text class="line" x="735" y="462">notes table</text>

  <rect class="data node-stroke" x="942" y="384" width="296" height="112" rx="56" />
  <text class="label" x="999" y="437">Lakebase Postgres</text>
  <text class="line" x="1022" y="462">orders_synced table</text>

  <rect class="infra node-stroke" x="954" y="566" width="274" height="106" rx="14" />
  <text class="label" x="983" y="617">postgres_synced_tables</text>
  <text class="line" x="1034" y="642">continuous sync</text>

  <rect class="data node-stroke" x="644" y="566" width="246" height="106" rx="56" />
  <text class="label" x="675" y="615">Unity Catalog Delta Table</text>
  <text class="line" x="700" y="640">main.sales.orders (CDF)</text>

  <rect class="infra node-stroke" x="816" y="724" width="254" height="104" rx="14" />
  <text class="label" x="848" y="773">postgres_catalogs</text>
  <text class="line" x="891" y="798">UC Binding</text>

  <rect class="svc node-stroke" x="1314" y="736" width="212" height="86" rx="14" />
  <text class="label" x="1337" y="770">SQL Warehouses</text>
  <text class="line" x="1363" y="794">and Notebooks</text>

  <path class="edge" d="M256 252 L306 246" />
  <path class="edge" d="M416 306 L410 372" />
  <path class="edge" d="M526 236 L646 236" />
  <path class="edge" d="M892 236 L940 236" />
  <path class="edge" d="M528 404 L644 434" />
  <path class="edge" d="M528 414 L942 434" />
  <path class="edge" d="M1089 306 L765 384" />
  <path class="edge" d="M1089 306 L1090 384" />
  <path class="edge" d="M890 619 L954 619" />
  <path class="edge" d="M1090 672 L1090 496" />
  <path class="edge" d="M1090 306 L944 724" />
  <path class="edge" d="M1070 776 L1314 779" />
</svg>
