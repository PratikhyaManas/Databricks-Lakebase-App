<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Orders Dashboard Architecture</title>
  <desc id="desc">SVG architecture diagram aligned with the Mermaid graph in README with non-overlapping connectors.</desc>

  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.5; }
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px Segoe UI, Arial, sans-serif; fill: #475569; }

      .app { fill: #ecf3ff; stroke: #3b82f6; }
      .infra { fill: #fff4e8; stroke: #ea580c; }
      .data { fill: #ebfbf2; stroke: #16a34a; }
      .node { stroke-width: 2; }

      .h1 { font: 700 18px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 600 14px Segoe UI, Arial, sans-serif; fill: #334155; }

      .edge { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .lane { font: 700 12px Segoe UI, Arial, sans-serif; fill: #64748b; letter-spacing: 0.4px; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="920" />
  <rect class="panel" x="26" y="26" width="1548" height="868" rx="14" />

  <text class="title" x="58" y="74">Orders Dashboard - Lakebase + Databricks</text>
  <text class="subtitle" x="58" y="100">Clean SVG layout with dedicated routing lanes and non-overlapping connectors.</text>

  <text class="lane" x="74" y="146">APP LANE</text>
  <text class="lane" x="682" y="146">CONTROL + DATA LANE</text>
  <text class="lane" x="1312" y="146">ANALYTICS LANE</text>

  <rect class="node app" x="90" y="200" width="180" height="84" rx="12" />
  <text class="h1" x="118" y="250">User Browser</text>

  <rect class="node app" x="330" y="180" width="250" height="112" rx="12" />
  <text class="h1" x="370" y="232">Databricks App</text>
  <text class="h2" x="362" y="258">Flask Orders Dashboard</text>

  <polygon class="node app" points="320,360 590,360 570,456 300,456" />
  <text class="h1" x="355" y="402">Routes and JSON API</text>
  <text class="h2" x="340" y="426">/, /api/orders, /api/notes</text>

  <rect class="node infra" x="690" y="180" width="260" height="112" rx="12" />
  <text class="h1" x="730" y="232">WorkspaceClient</text>
  <text class="h2" x="720" y="258">Generate DB Credential</text>

  <rect class="node infra" x="1020" y="180" width="340" height="112" rx="12" />
  <text class="h1" x="1060" y="232">Lakebase Endpoint</text>
  <text class="h2" x="1046" y="258">HA Read/Write + Readable Secondaries</text>

  <rect class="node data" x="900" y="360" width="250" height="96" rx="12" />
  <text class="h1" x="936" y="404">Lakebase Postgres</text>
  <text class="h2" x="994" y="428">notes table</text>

  <rect class="node data" x="1210" y="360" width="250" height="96" rx="12" />
  <text class="h1" x="1246" y="404">Lakebase Postgres</text>
  <text class="h2" x="1288" y="428">orders_synced table</text>

  <rect class="node data" x="680" y="560" width="270" height="98" rx="12" />
  <text class="h1" x="710" y="602">Unity Catalog Delta Table</text>
  <text class="h2" x="722" y="626">main.sales.orders with CDF</text>

  <rect class="node infra" x="1000" y="560" width="280" height="98" rx="12" />
  <text class="h1" x="1030" y="602">postgres_synced_tables</text>
  <text class="h2" x="1094" y="626">continuous sync</text>

  <rect class="node infra" x="1040" y="720" width="230" height="96" rx="12" />
  <text class="h1" x="1068" y="761">postgres_catalogs</text>
  <text class="h2" x="1106" y="784">UC Binding</text>

  <rect class="node app" x="1330" y="722" width="220" height="92" rx="12" />
  <text class="h1" x="1360" y="760">SQL Warehouses</text>
  <text class="h2" x="1387" y="784">and Notebooks</text>

  <path class="edge" d="M270 242 H330" />
  <path class="edge" d="M455 292 V360" />

  <path class="edge" d="M580 236 H690" />
  <path class="edge" d="M950 236 H1020" />

  <path class="edge" d="M570 402 H900" />
  <path class="edge" d="M570 430 H1210" />

  <path class="edge" d="M1105 292 V330 H1025 V360" />
  <path class="edge" d="M1235 292 V360" />

  <path class="edge" d="M950 609 H1000" />
  <path class="edge" d="M1280 609 V456" />

  <path class="edge" d="M1190 292 V700 H1155 V720" />
  <path class="edge" d="M1270 768 H1330" />
</svg>
