<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860" role="img" aria-labelledby="title desc">
  <title id="title">Orders Dashboard Architecture</title>
  <desc id="desc">Aligned SVG architecture diagram equivalent to the Mermaid graph in README.</desc>

  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px Segoe UI, Arial, sans-serif; fill: #475569; }

      .appNode { fill: #eef4ff; stroke: #3b82f6; }
      .infraNode { fill: #fff5eb; stroke: #ea580c; }
      .dataNode { fill: #ecfdf3; stroke: #16a34a; }
      .node { stroke-width: 2; }

      .label { font: 700 18px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 600 14px Segoe UI, Arial, sans-serif; fill: #334155; }

      .edge { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1560" height="860" />
  <rect class="frame" x="24" y="24" width="1512" height="812" rx="12" />

  <text class="title" x="56" y="74">Orders Dashboard - Lakebase + Databricks</text>
  <text class="subtitle" x="56" y="102">Grid-aligned SVG with orthogonal connectors matching the Mermaid architecture graph.</text>

  <rect class="node appNode" x="80" y="200" width="180" height="80" rx="12" />
  <text class="label" x="105" y="249">User Browser</text>

  <rect class="node appNode" x="320" y="180" width="240" height="110" rx="12" />
  <text class="label" x="356" y="232">Databricks App</text>
  <text class="sub" x="349" y="257">Flask Orders Dashboard</text>

  <polygon class="node appNode" points="300,360 560,360 540,450 280,450" />
  <text class="label" x="329" y="398">Routes and JSON API</text>
  <text class="sub" x="325" y="420">/, /api/orders, /api/notes</text>

  <rect class="node infraNode" x="640" y="180" width="250" height="110" rx="12" />
  <text class="label" x="676" y="232">WorkspaceClient</text>
  <text class="sub" x="670" y="257">Generate DB Credential</text>

  <rect class="node infraNode" x="940" y="180" width="360" height="110" rx="12" />
  <text class="label" x="978" y="232">Lakebase Endpoint</text>
  <text class="sub" x="963" y="257">HA Read/Write + Readable Secondaries</text>

  <g>
    <ellipse class="node dataNode" cx="760" cy="370" rx="125" ry="22" />
    <rect class="node dataNode" x="635" y="370" width="250" height="78" />
    <ellipse class="node dataNode" cx="760" cy="448" rx="125" ry="22" />
    <text class="label" x="680" y="406">Lakebase Postgres</text>
    <text class="sub" x="715" y="428">notes table</text>
  </g>

  <g>
    <ellipse class="node dataNode" cx="1120" cy="370" rx="150" ry="22" />
    <rect class="node dataNode" x="970" y="370" width="300" height="78" />
    <ellipse class="node dataNode" cx="1120" cy="448" rx="150" ry="22" />
    <text class="label" x="1029" y="406">Lakebase Postgres</text>
    <text class="sub" x="1044" y="428">orders_synced table</text>
  </g>

  <rect class="node infraNode" x="980" y="560" width="280" height="100" rx="12" />
  <text class="label" x="1010" y="607">postgres_synced_tables</text>
  <text class="sub" x="1074" y="631">continuous sync</text>

  <g>
    <ellipse class="node dataNode" cx="760" cy="560" rx="125" ry="22" />
    <rect class="node dataNode" x="635" y="560" width="250" height="74" />
    <ellipse class="node dataNode" cx="760" cy="634" rx="125" ry="22" />
    <text class="label" x="660" y="595">Unity Catalog Delta Table</text>
    <text class="sub" x="678" y="617">main.sales.orders with CDF</text>
  </g>

  <rect class="node infraNode" x="1000" y="710" width="230" height="96" rx="12" />
  <text class="label" x="1028" y="752">postgres_catalogs</text>
  <text class="sub" x="1066" y="775">UC Binding</text>

  <rect class="node appNode" x="1270" y="712" width="230" height="90" rx="12" />
  <text class="label" x="1299" y="750">SQL Warehouses and</text>
  <text class="label" x="1352" y="774">Notebooks</text>

  <path class="edge" d="M260 240 H290 V235 H320" />
  <path class="edge" d="M440 290 V325 H430 V360" />
  <path class="edge" d="M560 235 H640" />
  <path class="edge" d="M890 235 H940" />

  <path class="edge" d="M550 405 H592 V409 H635" />
  <path class="edge" d="M550 425 H760 V409 H970" />

  <path class="edge" d="M1120 290 V320 H760 V348" />
  <path class="edge" d="M1120 290 V348" />

  <path class="edge" d="M885 597 H932 V610 H980" />
  <path class="edge" d="M1120 560 V470" />

  <path class="edge" d="M1120 290 V500 H1115 V710" />
  <path class="edge" d="M1230 758 H1270" />
</svg>
